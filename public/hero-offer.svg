<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-label="First order offer 15 percent off">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCEDD4"/>
      <stop offset="0.5" stop-color="#FBD9A0"/>
      <stop offset="1" stop-color="#F7B45A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(960 160) rotate(140) scale(420)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4801F"/>
      <stop offset="1" stop-color="#F4801F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)" opacity="0.45"/>

  <!-- Gift box -->
  <g transform="translate(420 280)">
    <rect x="60" y="180" width="340" height="260" rx="20" fill="#1F6B3B"/>
    <rect x="60" y="180" width="340" height="80" rx="20" fill="#2F5233"/>
    <!-- Ribbon -->
    <rect x="212" y="180" width="36" height="260" fill="#F4801F"/>
    <path d="M230 180 C 180 120 120 160 150 200 C 175 230 210 200 230 180 Z" fill="#F4801F"/>
    <path d="M230 180 C 280 120 340 160 310 200 C 285 230 250 200 230 180 Z" fill="#F4801F"/>
    <!-- Bow knot -->
    <circle cx="230" cy="180" r="20" fill="#D9670F"/>
  </g>

  <!-- 15% badge -->
  <g transform="translate(760 200)">
    <circle cx="80" cy="80" r="80" fill="#C0472A"/>
    <circle cx="80" cy="80" r="80" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="10 10" opacity="0.8"/>
    <text x="80" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">15%</text>
    <text x="80" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">OFF</text>
  </g>

  <!-- Confetti dots -->
  <circle cx="200" cy="160" r="12" fill="#1F6B3B" opacity="0.6"/>
  <circle cx="1000" cy="560" r="14" fill="#B9740A" opacity="0.55"/>
  <circle cx="300" cy="640" r="10" fill="#5B4A96" opacity="0.5"/>
  <circle cx="900" cy="640" r="11" fill="#1F6B3B" opacity="0.5"/>
  <rect x="160" y="480" width="18" height="18" rx="4" fill="#C0472A" opacity="0.5" transform="rotate(20 169 489)"/>
  <rect x="980" y="360" width="16" height="16" rx="4" fill="#F4801F" opacity="0.6" transform="rotate(-15 988 368)"/>

  <!-- Brand mark -->
  <g transform="translate(90 90)">
    <circle cx="40" cy="40" r="40" fill="#F4801F"/>
    <path d="M40 18 C 52 18 60 30 60 44 C 60 54 52 62 40 62 C 28 62 20 54 20 44 C 20 30 28 18 40 18 Z" fill="#fff" opacity="0.9"/>
  </g>
</svg>
