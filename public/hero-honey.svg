<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none" role="img" aria-label="African organic wild honey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16241C"/>
      <stop offset="0.6" stop-color="#1F3A28"/>
      <stop offset="1" stop-color="#2F5233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(520 80) rotate(140) scale(300)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4801F"/>
      <stop offset="1" stop-color="#F4801F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#glow)" opacity="0.3"/>

  <!-- Honey dipper -->
  <g transform="translate(300 360)" stroke="#F7C36B" stroke-width="10" stroke-linecap="round">
    <line x1="0" y1="-180" x2="0" y2="60"/>
    <path d="M-26 -10 Q 0 30 26 -10" fill="none"/>
    <path d="M-22 20 Q 0 56 22 20" fill="none"/>
    <path d="M-18 50 Q 0 82 18 50" fill="none"/>
  </g>

  <!-- Honey drop -->
  <path d="M300 470 C 330 500 330 545 300 560 C 270 545 270 500 300 470 Z" fill="#F4801F"/>

  <!-- Jar -->
  <g transform="translate(180 560)">
    <rect x="0" y="40" width="240" height="180" rx="26" fill="#FDF6EC" opacity="0.95"/>
    <rect x="0" y="40" width="240" height="50" rx="26" fill="#F4801F" opacity="0.9"/>
    <rect x="60" y="0" width="120" height="54" rx="14" fill="#1F6B3B"/>
    <rect x="35" y="140" width="170" height="60" rx="14" fill="#F7C36B"/>
  </g>

  <!-- Leaf accents -->
  <g transform="translate(90 520)" stroke="#1F6B3B" stroke-width="5" fill="none" opacity="0.8">
    <path d="M30 40 C -10 10 10 -40 50 -30 C 40 20 55 55 30 40 Z" fill="#1F6B3B" opacity="0.3"/>
  </g>
  <g transform="translate(470 200)" stroke="#1F6B3B" stroke-width="5" fill="none" opacity="0.7">
    <path d="M20 30 C -15 5 5 -40 40 -30 C 30 15 45 45 20 30 Z" fill="#1F6B3B" opacity="0.3"/>
  </g>
</svg>
